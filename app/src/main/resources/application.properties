spring.application.name=execution-service
logging.structured.format.console=logstash

# Banco de dados (Docker local; trocar por variaveis do RDS depois)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/execution}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000

# JPA e Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=execution

# Migrations Flyway
spring.flyway.enabled=true
spring.flyway.create-schemas=true
spring.flyway.schemas=execution
spring.flyway.default-schema=execution

# Amazon SQS (LocalStack em dev; remover SQS_ENDPOINT e usar credenciais reais na AWS)
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID:test}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:test}
spring.cloud.aws.sqs.endpoint=${SQS_ENDPOINT:http://localhost:4566}
spring.cloud.aws.sqs.listener.auto-startup=${SQS_LISTENER_AUTO_STARTUP:true}
# Filas sao criadas pela infra (com DLQ); a aplicacao nao cria filas ausentes
spring.cloud.aws.sqs.queue-not-found-strategy=FAIL
# Limita a concorrencia dos listeners ao tamanho do pool de conexoes (3)
spring.cloud.aws.sqs.listener.max-concurrent-messages=${SQS_MAX_CONCURRENT:2}
spring.cloud.aws.sqs.listener.max-messages-per-poll=${SQS_MAX_MESSAGES_PER_POLL:2}

execution.sqs.os-criada=${SQS_OS_CRIADA:execution-os-criada}
execution.sqs.pagamento-confirmado=${SQS_PAGAMENTO_CONFIRMADO:execution-pagamento-confirmado}
execution.sqs.os-cancelada=${SQS_OS_CANCELADA:execution-os-cancelada}
execution.sqs.pagamento-estornado=${SQS_PAGAMENTO_ESTORNADO:execution-pagamento-estornado}
execution.sqs.saida=${SQS_SAIDA:execution-events}

# Publicacao da outbox
execution.outbox.enabled=${OUTBOX_ENABLED:true}
execution.outbox.intervalo-ms=${OUTBOX_INTERVALO_MS:1000}
execution.outbox.lote=${OUTBOX_LOTE:50}

# Seguranca e JWT
jwt.secret=${JWT_SECRET:minha-chave-secreta-dev-minimo-32-chars!!}

# Actuator e Health Probes
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Swagger OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
