apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-service
  namespace: tech-challenge
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Replace one Pod at a time so the new pool does not overlap old pools.
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: execution-service
  template:
    metadata:
      labels:
        app: execution-service
    spec:
      # A aplicacao nao usa a API do Kubernetes; nao precisa do token do service account
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: execution-service
          image: "IMAGE_PLACEHOLDER:TAG"
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
              ephemeral-storage: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
              ephemeral-storage: "1Gi"
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: execution-secrets
                  key: DB_URL
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: execution-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: execution-secrets
                  key: DB_PASSWORD
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: execution-secrets
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: execution-secrets
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: execution-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: execution-secrets
                  key: JWT_SECRET
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AWS_REGION
            - name: SQS_OS_EXECUTION
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SQS_OS_EXECUTION
            - name: SQS_BILLING_EXECUTION
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SQS_BILLING_EXECUTION
            - name: SNS_TOPICO_ARN
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SNS_TOPICO_ARN
            - name: SPRING_FLYWAY_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPRING_FLYWAY_ENABLED
            - name: SPRING_FLYWAY_SCHEMAS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPRING_FLYWAY_SCHEMAS
            - name: SWAGGER_BASE_PATH
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SWAGGER_BASE_PATH
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
